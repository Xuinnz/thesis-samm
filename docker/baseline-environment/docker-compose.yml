# docker/baseline-environment/docker-compose.yml
#
# Run from the repo root:
#   docker compose -f docker/baseline-environment/docker-compose.yml up characterization
#   docker compose -f docker/baseline-environment/docker-compose.yml up benchmark
#
# Both services build from the SAME Dockerfile/image — only the
# environment variables and (for characterization) the volume mount
# differ. This is the single-image-two-modes design described at the
# top of the Dockerfile.

services:
  # ---------------------------------------------------------------
  # Characterization pass: profiler ON, produces training_trace.csv
  # on the HOST via the volume mount (the container is ephemeral,
  # the CSV must survive after it exits).
  # ---------------------------------------------------------------
  characterization:
    build:
      context: ../..
      dockerfile: docker/baseline-environment/Dockerfile
    image: samm-baseline:latest
    container_name: samm-characterization
    ports:
      - "3000:3000"
    environment:
      SHADOW_PROFILER_ENABLED: "true"
      # Concurrently-tracked objects the profiler can hold. Overridable because
      # it must scale with load: batch.js alone issues ~200 allocations per
      # request, so at a few hundred RPS the concurrent count runs into the
      # thousands and a fixed 5000 silently starts dropping records.
      SHADOW_PROFILER_CAPACITY: "${SHADOW_PROFILER_CAPACITY:-5000}"
      SHADOW_PROFILER_STATS_INTERVAL_MS: "10000"
      # Workload shape must match the run the compiled table will serve. The
      # refinery sizes every arena from the demand it observes here, so
      # characterizing a lighter workload than the benchmark under-provisions
      # every stratum -- measured: a table fit at a 512KB absolute write cap and
      # a 100MB untouched retained store sent 54.4% of requests to the fallback
      # path when asked to serve 25% proportional touching and a 400MB written
      # store. Empty means the route defaults apply.
      SAMM_TOUCH_FRACTION: "${SAMM_TOUCH_FRACTION:-}"
      SAMM_RETAINED_BYTES: "${SAMM_RETAINED_BYTES:-}"
      # MUST be passed here too, not only in _bench-lib.sh. Compose forwards
      # only what is declared, so an unlisted variable silently reverts to the
      # route default -- and characterization then profiles a DIFFERENT workload
      # than the benchmark serves. Measured consequence: characterization ran
      # 32MB payloads (trace: mean 8.10MB, max 32.00MB) while the benchmark ran
      # 16MB, so every quota was fit against twice the demand it would serve.
      # HOLD_SCALE escaped this only by accident -- k6 inherits system env vars
      # into __ENV, containers do not.
      PROCESS_MAX_BYTES: "${PROCESS_MAX_BYTES:-}"
      # Not read by the server; present so the workload fingerprint can see it.
      # Lifetime sets how long each object holds its slot, which is the
      # concurrency every quota is derived from.
      HOLD_SCALE: "${HOLD_SCALE:-1}"
      PROCESS_HOLD_MS: "${PROCESS_HOLD_MS:-}"
      ENDPOINT_WEIGHTS: "${ENDPOINT_WEIGHTS:-}"
      FETCH_BYTES: "${FETCH_BYTES:-}"
      # jemalloc, not stock glibc. Under the pressure workload glibc reaches the
      # 1GB ceiling in 76 seconds and the container dies, which would truncate
      # the trace to an eighth of its scheduled length. The profiler records
      # call-site, size and lifespan -- properties of the APPLICATION, not of
      # malloc -- so the C allocator underneath does not change what is
      # measured; and SAMM itself runs on jemalloc, so this matches the
      # condition the table is compiled to serve. Set to "" to characterize on
      # glibc instead.
      LD_PRELOAD: "${CHARACTERIZATION_LD_PRELOAD-/usr/lib/x86_64-linux-gnu/libjemalloc.so.2}"
    volumes:
      - ../../datasets/shadow-telemetry/raw:/app/datasets/shadow-telemetry/raw
    mem_limit: 1024M
    memswap_limit: 1024M   # equal to mem_limit => zero swap headroom (true swap-off,
                            # stronger guarantee than mem_swappiness alone)
    mem_swappiness: 0
    cpus: 1.0

  # ---------------------------------------------------------------
  # Final benchmark condition: profiler OFF. Run this 100 times per
  # the methodology (n=100 independent test cycles for the baseline
  # condition). No volume needed — nothing is written to disk.
  # ---------------------------------------------------------------
  benchmark:
    build:
      context: ../..
      dockerfile: docker/baseline-environment/Dockerfile
    image: samm-baseline:latest
    container_name: samm-baseline-benchmark
    ports:
      - "3000:3000"
    environment:
      SHADOW_PROFILER_ENABLED: "false"
      SAMM_TOUCH_FRACTION: "${SAMM_TOUCH_FRACTION:-}"
      SAMM_RETAINED_BYTES: "${SAMM_RETAINED_BYTES:-}"
      # MUST be passed here too, not only in _bench-lib.sh. Compose forwards
      # only what is declared, so an unlisted variable silently reverts to the
      # route default -- and characterization then profiles a DIFFERENT workload
      # than the benchmark serves. Measured consequence: characterization ran
      # 32MB payloads (trace: mean 8.10MB, max 32.00MB) while the benchmark ran
      # 16MB, so every quota was fit against twice the demand it would serve.
      # HOLD_SCALE escaped this only by accident -- k6 inherits system env vars
      # into __ENV, containers do not.
      PROCESS_MAX_BYTES: "${PROCESS_MAX_BYTES:-}"
      # Not read by the server; present so the workload fingerprint can see it.
      # Lifetime sets how long each object holds its slot, which is the
      # concurrency every quota is derived from.
      HOLD_SCALE: "${HOLD_SCALE:-1}"
      PROCESS_HOLD_MS: "${PROCESS_HOLD_MS:-}"
      ENDPOINT_WEIGHTS: "${ENDPOINT_WEIGHTS:-}"
      FETCH_BYTES: "${FETCH_BYTES:-}"
    mem_limit: 1024M
    memswap_limit: 1024M
    mem_swappiness: 0
    cpus: 1.0